<text x="70" y="58" font-size="32" font-weight="700">Silta Alpha vs FastAPI: binary response throughput</text>
<text x="70" y="92" font-size="16" fill="#4b5563">3 x 4s runs per point; plotted values are medians. Identical in-memory response bytes.</text>
