<text x="370" y="128" font-size="15">FastAPI Response, one worker</text>
<text x="70" y="146" font-size="22" font-weight="700">64 KiB binary</text>
<text x="70" y="166" font-size="13" fill="#6b7280">65,536 bytes per response</text>
