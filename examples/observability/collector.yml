receivers:
  otlp:
    protocols:
      http:
        endpoint: "127.0.0.1:4318"
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 1024
exporters:
  prometheus:
    endpoint: "127.0.0.1:9465"
service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
