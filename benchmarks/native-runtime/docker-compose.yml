services:
  postgres:
    image: postgres:16-alpine
    container_name: silta-poc-postgres
    environment:
      POSTGRES_DB: silta_poc
      POSTGRES_USER: silta
      POSTGRES_PASSWORD: silta
    ports:
      - "55432:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "random_page_cost=1.1"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silta -d silta_poc"]
      interval: 2s
      timeout: 3s
      retries: 20
