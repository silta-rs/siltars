name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  msrv:
    name: Minimum Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Check minimum supported Rust
        run: cargo check --workspace --locked

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Rust-Python HTTP integration
        run: |
          cargo build -p silta-runtime
          PYTHONPATH=python SILTA_RUNTIME_BIN="$PWD/target/debug/silta-runtime" python -m unittest discover -s python/tests -p 'test_*integration.py'

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile package
        run: python -m compileall python examples
      - name: Test Python package
        run: PYTHONPATH=python python -m unittest discover -s python/tests -p 'test_*.py'
      - name: Run hello-world example
        run: PYTHONPATH=python python examples/hello-world/app.py
      - name: Build Python distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --wheel
          python -m twine check dist/*

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Markdown links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(".")
          failures = []
          pattern = re.compile(r"\[[^\]]+\]\(([^)]+)\)")

          for path in root.rglob("*.md"):
              if ".git" in path.parts:
                  continue
              for target in pattern.findall(path.read_text(encoding="utf-8")):
                  if "://" in target or target.startswith("#") or target.startswith("mailto:"):
                      continue
                  clean = target.split("#", 1)[0]
                  if not clean:
                      continue
                  resolved = (path.parent / clean).resolve()
                  if not resolved.exists():
                      failures.append(f"{path}: broken link: {target}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          PY
