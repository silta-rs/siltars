[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "siltars"
version = "0.1.0a0"
description = "A runtime-first backend framework: Python DX, Rust runtime."
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
]
authors = [
    { name = "Serrka" },
]
keywords = ["backend", "framework", "python", "rust", "runtime"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/silta-rs/siltars"
Issues = "https://github.com/silta-rs/siltars/issues"
Author = "https://github.com/Sergey2Gnezdilov/"

[project.scripts]
silta = "silta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/silta"]

[tool.hatch.build.targets.sdist]
include = [
    "/python",
    "/PYPI_README.md",
    "/LICENSE",
    "/NOTICE",
    "/LICENSING.md",
]
